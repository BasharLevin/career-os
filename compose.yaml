name: career-os

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${AZURE_SQL_PASSWORD:-LocalCareerOS!2026}
    ports:
      - '1433:1433'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - sql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3001
      APP_VERSION: local-compose
      LOG_LEVEL: debug
      NODE_ENV: development
      DATABASE_HOST: sql
      DATABASE_PORT: 1433
      DATABASE_NAME: master
      DATABASE_USER: sa
      DATABASE_PASSWORD: ${AZURE_SQL_PASSWORD:-LocalCareerOS!2026}
      DATABASE_ENCRYPT: 'false'
      DATABASE_TRUST_SERVER_CERTIFICATE: 'true'
      AUTH_MODE: local
      AUTH_ISSUER: career-os-local
      LOCAL_AUTH_SUBJECT: local-developer
    ports:
      - '3001:3001'
    depends_on:
      sql:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3001/health/live']
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      APP_VERSION: local-compose
      LOG_LEVEL: debug
      NODE_ENV: development
      WORKER_HEALTH_PORT: 3002
    ports:
      - '3002:3002'
    healthcheck:
      test:
        ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3002/health/live']
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  sql-data:
