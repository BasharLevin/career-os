name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: career-os-${{ matrix.service }}:ci

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CareerOS_CI_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CareerOS_CI_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      AUTH_MODE: local
      DATABASE_HOST: localhost
      DATABASE_PORT: 1433
      DATABASE_NAME: master
      DATABASE_USER: sa
      DATABASE_PASSWORD: CareerOS_CI_2026!
      DATABASE_ENCRYPT: false
      DATABASE_TRUST_SERVER_CERTIFICATE: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@career-os/api...
      - run: npm run db:migrate --workspace @career-os/api

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: azure/cli@v3
        with:
          inlineScript: |
            az bicep build --file infrastructure/bicep/main.bicep
            az bicep build --file infrastructure/bicep/apps.bicep
